name: Security Scan

# Bewusst NICHT auf pull_request getriggert: der PR-blockierende Scan läuft bereits in `static-checks`
# über dieselbe Composite-Action. Dieser Lauf fängt Schwachstellen ab, die erst nach dem letzten Commit
# bekannt werden.
on:
  schedule:
    - cron: '0 4 * * 1'   # Montag 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-scan:
    runs-on: windows-latest
    # Apple-Zielframeworks ausblenden: nur der macOS-Job installiert die iOS-Workload (siehe Tankradar.MAUI.csproj).
    env:
      IncludeAndroidTarget: 'false'
      IncludeIosTarget: 'false'
      IncludeMacCatalystTarget: 'false'
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI workloads
        run: dotnet workload restore Tankradar.sln

      - name: Restore
        run: dotnet restore Tankradar.sln -p:Configuration=Release

      - name: Security scan
        uses: ./.github/actions/security-scan
        with:
          solution-path: Tankradar.sln
          artifact-name: vulnerable-packages-weekly
