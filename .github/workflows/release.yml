name: Release

# Beide Trigger gehören zusammen: ein manuell gepushter Tag v*.*.* ist ein vollwertiger Release-Weg
# (z. B. der bewusste Start von 1.0.0). Automatische Versionen (Push auf main) bleiben nach den
# Projektregeln unter 1.0.
on:
  push:
    branches: [main]
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    name: release
    runs-on: windows-latest
    # Apple-Zielframeworks ausblenden: nur der macOS-Job installiert die iOS-Workload (siehe Tankradar.MAUI.csproj).
    env:
      IncludeAndroidTarget: 'false'
      IncludeIosTarget: 'false'
      IncludeMacCatalystTarget: 'false'
    timeout-minutes: 60
    concurrency:
      group: release
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    outputs:
      released: ${{ steps.version.outputs.released }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      release_kind: ${{ steps.version.outputs.release_kind }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Resolve release version
        id: version
        run: node scripts/resolve-release-version.mjs

      - name: Setup .NET
        if: steps.version.outputs.released == 'true'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.1xx'

      - name: Install MAUI workloads
        if: steps.version.outputs.released == 'true'
        run: dotnet workload restore Tankradar.sln

      - name: Release gate - regular tests (unit)
        # Blockierendes Release-Gate der deterministischen Lane (Category!=OsInterface). Erster Lauf von
        # `dotnet test --configuration Release` der Pipeline-Kette: hartkodierte Debug-Pfade in
        # Testhelfern würden hier auffallen (Vorlage, Abschnitt 11.6).
        if: steps.version.outputs.released == 'true'
        run: |
          dotnet test src/Tankradar.Tests.Unit --configuration Release --filter "Category!=OsInterface" --results-directory TestResults --logger "trx;LogFileName=test-results-unit.trx"

      - name: Release gate - regular tests (integration)
        if: steps.version.outputs.released == 'true'
        run: |
          dotnet test src/Tankradar.Tests.Integration --configuration Release --filter "Category!=OsInterface" --results-directory TestResults --logger "trx;LogFileName=test-results-integration.trx"

      - name: Release gate - OS interface tests (unit)
        # Best-effort-Lane (Issue #93): sichtbar, aber nicht blockierend — continue-on-error auf Schrittebene.
        if: steps.version.outputs.released == 'true'
        continue-on-error: true
        run: |
          dotnet test src/Tankradar.Tests.Unit --configuration Release --filter "Category=OsInterface" --results-directory TestResults --logger "trx;LogFileName=test-results-os-interface-unit.trx"

      - name: Release gate - OS interface tests (integration)
        if: steps.version.outputs.released == 'true'
        continue-on-error: true
        run: |
          dotnet test src/Tankradar.Tests.Integration --configuration Release --filter "Category=OsInterface" --results-directory TestResults --logger "trx;LogFileName=test-results-os-interface-integration.trx"

      - name: Upload release-gate test results
        if: always() && steps.version.outputs.released == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: test-results-release
          path: TestResults/*.trx
          retention-days: 14

  # iOS-Variante des Releases: signiert und verbindlich per iTMSTransporter nach TestFlight hochgeladen
  # (require-upload='true') - fehlende Signierung oder fehlende Secrets lassen den Job fehlschlagen
  # statt still auf einen unsignierten Compile-Check zurückzufallen (Issue #64).
  ios:
    name: ios
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build, sign and upload iOS
        id: ios
        uses: ./.github/actions/package-ios
        with:
          release-version: ${{ needs.release.outputs.version }}
          signing-enabled: ${{ vars.IOS_SIGNING_ENABLED }}
          bundle-id: ${{ vars.APP_BUNDLE_ID }}
          codesign-key: ${{ secrets.IOS_CODESIGN_KEY }}
          provisioning-profile: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          certificate-p12-base64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          certificate-p12-password: ${{ secrets.IOS_CERTIFICATE_P12_PASSWORD }}
          provisioning-profile-base64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          api-key-id: ${{ secrets.IOS_API_KEY_ID }}
          api-issuer-id: ${{ secrets.IOS_API_ISSUER_ID }}
          api-key-p8: ${{ secrets.IOS_API_KEY_P8 }}
          xcode-version: ${{ vars.IOS_XCODE_VERSION }}
          fuel-price-api-key: ${{ secrets.FUEL_PRICE_API_KEY }}
          require-upload: 'true'

  # Release-Tag erst nach erfolgreichem TestFlight-Upload pushen: Der Tag markiert "ausgeliefert" -
  # scheitert der iOS-Job, wird die Version nicht "verbraucht" und ein erneuter Lauf kann sie
  # wiederholen (es gibt keinen Reparaturpfad mehr). Der Push läuft mit den GITHUB_TOKEN-Credentials
  # von actions/checkout und löst daher keinen neuen Workflow-Lauf aus (der v*.*.*-Trigger feuert
  # nicht auf den workflow-eigenen Tag-Push). Beim manuellen Weg (release_kind == 'manual') existiert
  # der Tag bereits als Auslöser.
  finalize:
    name: finalize
    needs: [release, ios]
    if: needs.release.outputs.released == 'true' && needs.release.outputs.release_kind == 'automatic'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Tag and push release tag
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          git tag "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "$RELEASE_TAG"
