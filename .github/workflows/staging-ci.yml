name: Pre-Release

# ACHTUNG: staging-to-main-promotion.yml referenziert den Anzeigenamen dieses Workflows
# ("Pre-Release"). Wird er geändert, muss dort `workflows: [...]` im selben Commit angepasst werden.
on:
  push:
    branches:
      - staging

concurrency:
  group: staging-ci
  cancel-in-progress: false

permissions:
  contents: read
  checks: write

jobs:
  detect-backmerge:
    runs-on: ubuntu-latest
    outputs:
      is_backmerge: ${{ steps.check.outputs.is_backmerge }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check whether this push is a pure back-merge from main
        id: check
        env:
          HEAD_SHA: ${{ github.sha }}
        run: |
          git fetch origin main:refs/remotes/origin/main --no-tags

          # Ausgewertet wird der Head-Commit, nicht HEAD: Bei pull_request ist HEAD der GitHub-Merge-Commit,
          # dessen erster Parent die Spitze des Basisbranches ist (== main, wenn staging == main).
          # Logik und Tests: scripts/detect-backmerge.mjs
          main_sha="$(git rev-parse origin/main)"
          is_backmerge="$(node scripts/detect-backmerge.mjs "$HEAD_SHA" "$main_sha")"
          echo "is_backmerge=$is_backmerge" >> "$GITHUB_OUTPUT"
          if [[ "$is_backmerge" == "true" ]]; then
            echo "::notice::Back-merge from main detected - CI checks will be skipped."
          fi

  static-checks:
    name: static checks
    needs: detect-backmerge
    if: needs.detect-backmerge.outputs.is_backmerge != 'true'
    runs-on: windows-latest
    # Apple-Zielframeworks ausblenden: nur der macOS-Job installiert die iOS-Workload (siehe Tankradar.MAUI.csproj).
    env:
      IncludeAndroidTarget: 'false'
      IncludeIosTarget: 'false'
      IncludeMacCatalystTarget: 'false'
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install MAUI workloads
        run: dotnet workload restore Tankradar.sln

      - name: Restore
        run: dotnet restore Tankradar.sln -p:Configuration=Release

      - name: Pipeline script tests
        run: npm test

      - name: iOS deployment script checks
        # Syntax-, Hilfe- und Abbruchprüfung von scripts/iOS-Deployment.ps1 (ohne Mac).
        run: pwsh -NoProfile -File scripts/test-ios-deployment.ps1

      - name: Format check
        run: dotnet format Tankradar.sln --verify-no-changes --no-restore --severity error

      - name: Security scan
        uses: ./.github/actions/security-scan
        with:
          solution-path: Tankradar.sln
          artifact-name: vulnerable-packages-staging

      - name: Static analysis
        run: dotnet build Tankradar.sln --configuration Release --no-restore -p:TreatWarningsAsErrors=true

  build-and-test:
    name: build & test
    needs: detect-backmerge
    if: needs.detect-backmerge.outputs.is_backmerge != 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      IncludeAndroidTarget: 'false'
      IncludeIosTarget: 'false'
      IncludeMacCatalystTarget: 'false'
      COVERAGE_THRESHOLD: '70'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install MAUI workloads
        run: dotnet workload restore Tankradar.sln

      - name: Restore
        run: dotnet restore Tankradar.sln -p:Configuration=Release

      - name: Build
        run: dotnet build Tankradar.sln --configuration Release --no-restore

      - name: Test unit (blocking)
        run: >
          dotnet test src/Tankradar.Tests.Unit --configuration Release --no-build
          --settings coverlet.runsettings --collect:"XPlat Code Coverage" --results-directory TestResults
          --logger "trx;LogFileName=test-results-unit.trx" --logger "console;verbosity=normal"

      - name: Test integration (blocking)
        run: >
          dotnet test src/Tankradar.Tests.Integration --configuration Release --no-build
          --settings coverlet.runsettings --collect:"XPlat Code Coverage" --results-directory TestResults
          --logger "trx;LogFileName=test-results-integration.trx" --logger "console;verbosity=normal"

      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool --version 5.5.11

      - name: Generate coverage report
        run: reportgenerator "-reports:TestResults/**/coverage.cobertura.xml" "-targetdir:coverage-report" "-reporttypes:TextSummary"

      - name: Enforce coverage threshold
        run: node scripts/check-coverage.mjs coverage-report/Summary.txt "$COVERAGE_THRESHOLD"

      - name: Test E2E with FlaUI (blocking)
        # Blockierend (bewusste Abweichung von der CI-Vorlage, Abschnitt 4: dort best-effort): Eine Auslieferung erfolgt nur mit
        # vollständig grünen Tests. Der Schritt steht nach der Coverage-Prüfung, damit deren Ergebnis auch bei einem E2E-Fehlschlag
        # vorliegt; kein Coverage-Collector (die UI-Tests dürfen die Abdeckung nicht verwässern). Die App läuft im Testmodus
        # außerhalb des sichtbaren Bildschirmbereichs (Off-Screen); Rückfall auf den Vordergrundbetrieb ohne Codeänderung über die
        # Repository-Variable TANKRADAR_E2E_WINDOW=foreground. Diagnose-Artefakte und die begrenzte Wiederholung bei UI-Automation-
        # Timeouts (TransientRetry) bleiben erhalten.
        env:
          TANKRADAR_E2E_WINDOW: ${{ vars.TANKRADAR_E2E_WINDOW || 'offscreen' }}
        run: >
          dotnet test src/Tankradar.Tests.E2E --configuration Release --no-build
          --results-directory TestResults
          --logger "trx;LogFileName=test-results-e2e.trx" --logger "console;verbosity=normal"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-staging
          path: coverage-report/
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-staging
          path: TestResults/*.trx
          retention-days: 14

      - name: Upload E2E diagnostics
        # Screenshot, UI-Automation-Baum und Fehlerbeschreibung fehlgeschlagener FlaUI-Tests (Vorlage 11.4).
        # if: always(), damit auch bei fehlgeschlagenen Läufen Diagnosematerial erhalten bleibt.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-diagnostics-staging
          path: e2e-diagnostics/
          if-no-files-found: ignore
          retention-days: 14

  version:
    name: version
    needs: [detect-backmerge, static-checks, build-and-test]
    if: needs.detect-backmerge.outputs.is_backmerge != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.semver.outputs.changed }}
      version: ${{ steps.semver.outputs.version }}
      rc_tag: ${{ steps.semver.outputs.rc_tag }}
      rc_version: ${{ steps.semver.outputs.rc_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Determine next version and RC number
        # scripts/determine-next-version.mjs ersetzt `semantic-release --dry-run` der Vorlage (erste Version
        # 0.1.0, nie automatisch auf 1.0). rc_version (mit Suffix, ohne v) - nicht `version` - muss in die
        # Build-Jobs fließen, sonst melden update.json und das Paket die stabile statt der RC-Version
        # (Vorlage, Abschnitt 11.2).
        id: semver
        run: node scripts/determine-next-version.mjs --rc

  prerelease:
    name: prerelease
    needs: [detect-backmerge, version]
    if: needs.detect-backmerge.outputs.is_backmerge != 'true' && needs.version.outputs.changed == 'true'
    runs-on: windows-latest
    # Apple-Zielframeworks ausblenden: nur der macOS-Job installiert die iOS-Workload (siehe Tankradar.MAUI.csproj).
    env:
      IncludeAndroidTarget: 'false'
      IncludeIosTarget: 'false'
      IncludeMacCatalystTarget: 'false'
    timeout-minutes: 45
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build and package release candidate
        uses: ./.github/actions/build-and-package
        with:
          release-version: ${{ needs.version.outputs.rc_version }}
          release-tag: ${{ needs.version.outputs.rc_tag }}
          fuel-price-api-key: ${{ secrets.FUEL_PRICE_API_KEY }}
          routing-api-key: ${{ secrets.ROUTING_API_KEY }}

      - name: Create GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          RC_TAG: ${{ needs.version.outputs.rc_tag }}
        run: |
          gh release create "$RC_TAG" artifacts/release-win-x64.zip artifacts/update.json \
            --target "$GITHUB_SHA" \
            --title "$RC_TAG" \
            --prerelease \
            --generate-notes

  # iOS-Pre-Release-Build: signiert (und optional nach TestFlight hochgeladen), wenn IOS_SIGNING_ENABLED='true'
  # und alle Secrets vorhanden sind, sonst unsigniert (Compile-Prüfung) - ohne Fehlschlag.
  ios-prerelease:
    name: ios prerelease
    needs: [detect-backmerge, version]
    if: needs.detect-backmerge.outputs.is_backmerge != 'true' && needs.version.outputs.changed == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build, sign and upload iOS
        id: ios
        uses: ./.github/actions/package-ios
        with:
          release-version: ${{ needs.version.outputs.rc_version }}
          signing-enabled: ${{ vars.IOS_SIGNING_ENABLED }}
          bundle-id: ${{ vars.APP_BUNDLE_ID }}
          codesign-key: ${{ secrets.IOS_CODESIGN_KEY }}
          provisioning-profile: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          certificate-p12-base64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          certificate-p12-password: ${{ secrets.IOS_CERTIFICATE_P12_PASSWORD }}
          provisioning-profile-base64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          api-key-id: ${{ secrets.IOS_API_KEY_ID }}
          api-issuer-id: ${{ secrets.IOS_API_ISSUER_ID }}
          api-key-p8: ${{ secrets.IOS_API_KEY_P8 }}
          xcode-version: ${{ vars.IOS_XCODE_VERSION }}
          fuel-price-api-key: ${{ secrets.FUEL_PRICE_API_KEY }}
          routing-api-key: ${{ secrets.ROUTING_API_KEY }}

      - name: Upload signed IPA
        if: steps.ios.outputs.signed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ios-ipa-prerelease
          path: release-ios.ipa
          if-no-files-found: error
          retention-days: 14

  back-merge-skip:
    needs: detect-backmerge
    if: needs.detect-backmerge.outputs.is_backmerge == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Back-merge detected
        run: echo "This push is a pure back-merge from main - all checks skipped."
