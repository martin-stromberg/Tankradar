name: Pre-Release

# ACHTUNG: staging-to-main-promotion.yml referenziert den Anzeigenamen dieses Workflows
# ("Pre-Release"). Wird er geändert, muss dort `workflows: [...]` im selben Commit angepasst werden.
on:
  push:
    branches:
      - staging

concurrency:
  group: staging-ci
  cancel-in-progress: false

permissions:
  contents: read
  checks: write

jobs:
  detect-backmerge:
    runs-on: ubuntu-latest
    outputs:
      is_backmerge: ${{ steps.check.outputs.is_backmerge }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check whether this push is a pure back-merge from main
        id: check
        run: |
          git fetch origin main:refs/remotes/origin/main --no-tags

          main_sha="$(git rev-parse origin/main)"
          is_main_merge_parent=false
          for parent in $(git show -s --format=%P HEAD); do
            if [[ "$parent" == "$main_sha" ]]; then
              is_main_merge_parent=true
              break
            fi
          done

          if [[ "$is_main_merge_parent" == "true" ]]; then
            echo "is_backmerge=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Back-merge from main detected - CI checks will be skipped."
          elif git diff --quiet origin/main HEAD; then
            echo "is_backmerge=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Pure back-merge from main detected (tree identical) - CI checks will be skipped."
          else
            echo "is_backmerge=false" >> "$GITHUB_OUTPUT"
          fi

  static-checks:
    name: static checks
    needs: detect-backmerge
    if: needs.detect-backmerge.outputs.is_backmerge != 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install MAUI workloads
        run: dotnet workload restore Tankradar.sln

      - name: Restore
        run: dotnet restore Tankradar.sln -p:Configuration=Release

      - name: Pipeline script tests
        run: npm test

      - name: Format check
        run: dotnet format Tankradar.sln --verify-no-changes --no-restore --severity error

      - name: Security scan
        uses: ./.github/actions/security-scan
        with:
          solution-path: Tankradar.sln
          artifact-name: vulnerable-packages-staging

      - name: Static analysis
        run: dotnet build Tankradar.sln --configuration Release --no-restore -p:TreatWarningsAsErrors=true

  build-and-test:
    name: build & test
    needs: detect-backmerge
    if: needs.detect-backmerge.outputs.is_backmerge != 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      COVERAGE_THRESHOLD: '70'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install MAUI workloads
        run: dotnet workload restore Tankradar.sln

      - name: Restore
        run: dotnet restore Tankradar.sln -p:Configuration=Release

      - name: Build
        run: dotnet build Tankradar.sln --configuration Release --no-restore

      - name: Test unit (blocking)
        run: >
          dotnet test src/Tankradar.Tests.Unit --configuration Release --no-build
          --settings coverlet.runsettings --collect:"XPlat Code Coverage" --results-directory TestResults
          --logger "trx;LogFileName=test-results-unit.trx" --logger "console;verbosity=normal"

      - name: Test integration (blocking)
        run: >
          dotnet test src/Tankradar.Tests.Integration --configuration Release --no-build
          --settings coverlet.runsettings --collect:"XPlat Code Coverage" --results-directory TestResults
          --logger "trx;LogFileName=test-results-integration.trx" --logger "console;verbosity=normal"

      - name: Test E2E with FlaUI (best-effort)
        id: e2e
        continue-on-error: true
        run: >
          dotnet test src/Tankradar.Tests.E2E --configuration Release --no-build
          --results-directory TestResults
          --logger "trx;LogFileName=test-results-e2e.trx" --logger "console;verbosity=normal"

      - name: Report E2E result
        if: steps.e2e.outcome == 'failure'
        run: echo "::warning::Die FlaUI-E2E-Tests sind fehlgeschlagen (best-effort, blockiert nicht). Siehe Artefakt test-results-staging."

      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool --version 5.5.11

      - name: Generate coverage report
        run: reportgenerator "-reports:TestResults/**/coverage.cobertura.xml" "-targetdir:coverage-report" "-reporttypes:TextSummary"

      - name: Enforce coverage threshold
        run: node scripts/check-coverage.mjs coverage-report/Summary.txt "$COVERAGE_THRESHOLD"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-staging
          path: coverage-report/
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-staging
          path: TestResults/*.trx
          retention-days: 14

  version:
    name: version
    needs: [detect-backmerge, static-checks, build-and-test]
    if: needs.detect-backmerge.outputs.is_backmerge != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.semver.outputs.changed }}
      version: ${{ steps.semver.outputs.version }}
      rc_tag: ${{ steps.semver.outputs.rc_tag }}
      rc_version: ${{ steps.semver.outputs.rc_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Determine next version and RC number
        # scripts/determine-next-version.mjs ersetzt `semantic-release --dry-run` der Vorlage (erste Version
        # 0.1.0, nie automatisch auf 1.0). rc_version (mit Suffix, ohne v) - nicht `version` - muss in die
        # Build-Jobs fließen, sonst melden update.json und das Paket die stabile statt der RC-Version
        # (Vorlage, Abschnitt 11.2).
        id: semver
        run: node scripts/determine-next-version.mjs --rc

  prerelease:
    name: prerelease
    needs: [detect-backmerge, version]
    if: needs.detect-backmerge.outputs.is_backmerge != 'true' && needs.version.outputs.changed == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build and package release candidate
        uses: ./.github/actions/build-and-package
        with:
          release-version: ${{ needs.version.outputs.rc_version }}
          release-tag: ${{ needs.version.outputs.rc_tag }}
          fuel-price-api-key: ${{ secrets.FUEL_PRICE_API_KEY }}
          routing-api-key: ${{ secrets.ROUTING_API_KEY }}

      - name: Create GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          RC_TAG: ${{ needs.version.outputs.rc_tag }}
        run: |
          gh release create "$RC_TAG" artifacts/release-win-x64.zip artifacts/update.json \
            --target "$GITHUB_SHA" \
            --title "$RC_TAG" \
            --prerelease \
            --generate-notes

  # iOS-Pre-Release-Build: signiert, wenn alle Secrets/Variablen vorhanden sind, sonst unsigniert.
  ios-prerelease:
    name: ios prerelease
    needs: [detect-backmerge, version]
    if: needs.detect-backmerge.outputs.is_backmerge != 'true' && needs.version.outputs.changed == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build iOS
        uses: ./.github/actions/build-ios
        with:
          release-version: ${{ needs.version.outputs.rc_version }}
          build-number: ${{ github.run_number }}
          bundle-id: ${{ vars.APP_BUNDLE_ID }}
          apple-team-id: ${{ vars.APPLE_TEAM_ID }}
          codesign-key: ${{ vars.IOS_CODESIGN_KEY }}
          provisioning-profile-name: ${{ vars.IOS_PROVISIONING_PROFILE }}
          certificate-p12-base64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          certificate-password: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          provisioning-profile-base64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          xcode-version: ${{ vars.IOS_XCODE_VERSION }}
          fuel-price-api-key: ${{ secrets.FUEL_PRICE_API_KEY }}
          routing-api-key: ${{ secrets.ROUTING_API_KEY }}
          artifact-name: ios-ipa-prerelease

  back-merge-skip:
    needs: detect-backmerge
    if: needs.detect-backmerge.outputs.is_backmerge == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Back-merge detected
        run: echo "This push is a pure back-merge from main - all checks skipped."
