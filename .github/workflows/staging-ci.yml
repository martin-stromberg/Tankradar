name: Pre-Release

# ACHTUNG: staging-to-main-promotion.yml referenziert den Anzeigenamen dieses Workflows
# ("Pre-Release"). Wird er geändert, muss dort `workflows: [...]` im selben Commit angepasst werden.
on:
  push:
    branches:
      - staging

concurrency:
  group: staging-ci
  cancel-in-progress: false

permissions:
  contents: read
  checks: write

jobs:
  detect-backmerge:
    runs-on: ubuntu-latest
    outputs:
      is_backmerge: ${{ steps.check.outputs.is_backmerge }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check whether this push is a pure back-merge from main
        id: check
        env:
          HEAD_SHA: ${{ github.sha }}
        run: |
          git fetch origin main:refs/remotes/origin/main --no-tags

          # Ausgewertet wird der Head-Commit, nicht HEAD: Bei pull_request ist HEAD der GitHub-Merge-Commit,
          # dessen erster Parent die Spitze des Basisbranches ist (== main, wenn staging == main).
          # Logik und Tests: scripts/detect-backmerge.mjs
          main_sha="$(git rev-parse origin/main)"
          is_backmerge="$(node scripts/detect-backmerge.mjs "$HEAD_SHA" "$main_sha")"
          echo "is_backmerge=$is_backmerge" >> "$GITHUB_OUTPUT"
          if [[ "$is_backmerge" == "true" ]]; then
            echo "::notice::Back-merge from main detected - CI checks will be skipped."
          fi

  static-checks:
    name: static checks
    needs: detect-backmerge
    if: needs.detect-backmerge.outputs.is_backmerge != 'true'
    runs-on: windows-latest
    # Apple-Zielframeworks ausblenden: nur der macOS-Job installiert die iOS-Workload (siehe Tankradar.MAUI.csproj).
    env:
      IncludeAndroidTarget: 'false'
      IncludeIosTarget: 'false'
      IncludeMacCatalystTarget: 'false'
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.1xx'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install MAUI workloads
        run: dotnet workload restore Tankradar.sln

      - name: Restore
        run: dotnet restore Tankradar.sln -p:Configuration=Release

      - name: Pipeline script tests
        run: npm test

      - name: iOS deployment script checks
        # Syntax-, Hilfe- und Abbruchprüfung von scripts/iOS-Deployment.ps1 (ohne Mac).
        run: pwsh -NoProfile -File scripts/test-ios-deployment.ps1

      - name: Format check
        run: dotnet format Tankradar.sln --verify-no-changes --no-restore --severity error

      - name: Security scan
        uses: ./.github/actions/security-scan
        with:
          solution-path: Tankradar.sln
          artifact-name: vulnerable-packages-staging

      - name: Static analysis
        run: dotnet build Tankradar.sln --configuration Release --no-restore -p:TreatWarningsAsErrors=true

  build-and-test:
    name: build & test
    needs: detect-backmerge
    if: needs.detect-backmerge.outputs.is_backmerge != 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      IncludeAndroidTarget: 'false'
      IncludeIosTarget: 'false'
      IncludeMacCatalystTarget: 'false'
      COVERAGE_THRESHOLD: '70'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.1xx'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install MAUI workloads
        run: dotnet workload restore Tankradar.sln

      - name: Restore
        run: dotnet restore Tankradar.sln -p:Configuration=Release

      - name: Build
        run: dotnet build Tankradar.sln --configuration Release --no-restore

      - name: Test regular (unit)
        # Blockierende Lane: nur deterministische Tests (Category!=OsInterface); OS-nahe Tests laufen
        # im Job "os-interface-tests" als best-effort (Issue #93).
        run: >
          dotnet test src/Tankradar.Tests.Unit --configuration Release --no-build
          --filter "Category!=OsInterface"
          --settings coverlet.runsettings --collect:"XPlat Code Coverage" --results-directory TestResults
          --logger "trx;LogFileName=test-results-unit.trx" --logger "console;verbosity=normal"

      - name: Test regular (integration)
        run: >
          dotnet test src/Tankradar.Tests.Integration --configuration Release --no-build
          --filter "Category!=OsInterface"
          --settings coverlet.runsettings --collect:"XPlat Code Coverage" --results-directory TestResults
          --logger "trx;LogFileName=test-results-integration.trx" --logger "console;verbosity=normal"

      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool --version 5.5.11

      - name: Generate coverage report
        run: reportgenerator "-reports:TestResults/**/coverage.cobertura.xml" "-targetdir:coverage-report" "-reporttypes:TextSummary"

      - name: Enforce coverage threshold
        run: node scripts/check-coverage.mjs coverage-report/Summary.txt "$COVERAGE_THRESHOLD"

      - name: Prepare E2E crash dump directory
        # Issue #22: Zielverzeichnis für Speicherabzüge des App-Prozesses bei einem Absturz (0xC0000005 im WinRT-Finalizer).
        run: mkdir -p e2e-dumps

      - name: Test regular (E2E)
        # Blockierende Lane: Category!=OsInterface enthält derzeit nur die nicht markierten Tests
        # (StartFailureCleanupE2ETests, FlakyConventionTests) — sämtliche FlaUI-E2E-Tests sind über die
        # E2ETestBase als OsInterface markiert und laufen im Job "os-interface-tests" als best-effort
        # (Issue #93). Der Schritt steht nach der Coverage-Prüfung, damit deren Ergebnis auch bei einem
        # Fehlschlag vorliegt; kein Coverage-Collector. Die Env-Variablen bleiben für den Fall, dass
        # später unmarkierte E2E-Tests die App starten.
        env:
          TANKRADAR_E2E_WINDOW: ${{ vars.TANKRADAR_E2E_WINDOW || 'offscreen' }}
          DOTNET_DbgEnableMiniDump: '1'
          DOTNET_DbgMiniDumpType: '2'
          DOTNET_DbgMiniDumpName: ${{ github.workspace }}/e2e-dumps/tankradar-dump-%p.dmp
        run: >
          dotnet test src/Tankradar.Tests.E2E --configuration Release --no-build
          --filter "Category!=OsInterface"
          --results-directory TestResults
          --logger "trx;LogFileName=test-results-e2e.trx" --logger "console;verbosity=normal"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-staging
          path: coverage-report/
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-staging
          path: TestResults/*.trx
          retention-days: 14

      - name: Upload E2E diagnostics
        # Screenshot, UI-Automation-Baum und Fehlerbeschreibung fehlgeschlagener FlaUI-Tests (Vorlage 11.4).
        # if: always(), damit auch bei fehlgeschlagenen Läufen Diagnosematerial erhalten bleibt.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-diagnostics-staging
          path: e2e-diagnostics/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload E2E crash dumps
        # Issue #22: Speicherabzug des App-Prozesses bei einem Absturz (z. B. 0xC0000005 im WinRT-Finalizer); leer im Regelfall.
        # if: always(), da der Absturz den E2E-Testlauf selbst nicht fehlschlagen lässt.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-dumps-staging
          path: e2e-dumps/
          if-no-files-found: ignore
          retention-days: 7

  # Best-effort-Lane für Tests mit echter Betriebssystem-Schnittstellen-Berührung (FlaUI/UI-Automation,
  # echte Prozessstarts, Loopback-HttpListener): sichtbar, aber nicht blockierend — echte Desktop-
  # Umgebungen sind auf GitHub-Runnern nicht immer zuverlässig (Issue #93). Der Job läuft bewusst
  # getrennt von build-and-test und ist nicht Teil der needs-Kette des version-Jobs, damit weder seine
  # Laufzeit noch ein best-effort-Fehlschlag das Release-Gate beeinflussen. Job-Level-continue-on-error
  # hält die Lane nicht-blockierend; fehlgeschlagene Flaky-markierte Tests werden genau einmal gefiltert
  # wiederholt.
  os-interface-tests:
    name: os-interface tests
    needs: detect-backmerge
    if: needs.detect-backmerge.outputs.is_backmerge != 'true'
    continue-on-error: true
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      IncludeAndroidTarget: 'false'
      IncludeIosTarget: 'false'
      IncludeMacCatalystTarget: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.1xx'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install MAUI workloads
        run: dotnet workload restore Tankradar.sln

      - name: Restore
        run: dotnet restore Tankradar.sln -p:Configuration=Release

      - name: Build
        run: dotnet build Tankradar.sln --configuration Release --no-restore

      - name: Prepare E2E crash dump directory
        run: mkdir -p e2e-dumps

      - name: Test OS interface (unit)
        run: >
          dotnet test src/Tankradar.Tests.Unit --configuration Release --no-build
          --filter "Category=OsInterface"
          --results-directory TestResults
          --logger "trx;LogFileName=test-results-os-interface-unit.trx" --logger "console;verbosity=normal"

      - name: Test OS interface (integration)
        run: >
          dotnet test src/Tankradar.Tests.Integration --configuration Release --no-build
          --filter "Category=OsInterface"
          --results-directory TestResults
          --logger "trx;LogFileName=test-results-os-interface-integration.trx" --logger "console;verbosity=normal"

      - name: Test OS interface (E2E)
        # Die DOTNET_Dbg*-Variablen wirken auf den von FlaUI gestarteten App-Prozess (Umgebung wird
        # vererbt); sie erzeugen bei einem Absturz (z. B. 0xC0000005 im WinRT-Finalizer, Issue #22)
        # einen Speicherabzug mit der PID im Dateinamen.
        env:
          TANKRADAR_E2E_WINDOW: ${{ vars.TANKRADAR_E2E_WINDOW || 'offscreen' }}
          DOTNET_DbgEnableMiniDump: '1'
          DOTNET_DbgMiniDumpType: '2'
          DOTNET_DbgMiniDumpName: ${{ github.workspace }}/e2e-dumps/tankradar-dump-%p.dmp
        run: >
          dotnet test src/Tankradar.Tests.E2E --configuration Release --no-build
          --filter "Category=OsInterface"
          --results-directory TestResults
          --logger "trx;LogFileName=test-results-os-interface-e2e.trx" --logger "console;verbosity=normal"

      - name: Retry flaky tests once
        # if: failure() ist bewusst breit: Bei Build-Fehlschlag oder fehlendem TRX meldet das Skript
        # "keine Flaky-Fehlschläge" und endet mit 0, sodass der ursprüngliche Fehlschlag das führende
        # Signal bleibt. Persistente Flaky-Fehlschläge lassen den Schritt fehlschlagen — der Job bleibt
        # über das Job-Level-continue-on-error trotzdem nicht-blockierend.
        if: failure()
        shell: pwsh
        run: |
          $exitCode = 0
          & scripts/Retry-FlakyTests.ps1 -TestProject src/Tankradar.Tests.Unit/Tankradar.Tests.Unit.csproj -PrimaryTrx TestResults/test-results-os-interface-unit.trx -Configuration Release
          if ($LASTEXITCODE -ne 0) { $exitCode = $LASTEXITCODE }
          & scripts/Retry-FlakyTests.ps1 -TestProject src/Tankradar.Tests.Integration/Tankradar.Tests.Integration.csproj -PrimaryTrx TestResults/test-results-os-interface-integration.trx -Configuration Release
          if ($LASTEXITCODE -ne 0) { $exitCode = $LASTEXITCODE }
          & scripts/Retry-FlakyTests.ps1 -TestProject src/Tankradar.Tests.E2E/Tankradar.Tests.E2E.csproj -PrimaryTrx TestResults/test-results-os-interface-e2e.trx -Configuration Release
          if ($LASTEXITCODE -ne 0) { $exitCode = $LASTEXITCODE }
          exit $exitCode

      - name: Analyze flaky test results
        # Reiner Sichtbarkeits-Report über die TestResults-Verzeichnisse dieses Laufs (Exit immer 0).
        if: always()
        shell: pwsh
        run: |
          & scripts/Analyze-FlakyTestResults.ps1 -Path TestResults

      - name: Upload OS-interface test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-os-interface-staging
          path: TestResults/test-results-os-interface*.trx
          retention-days: 14

      - name: Upload OS-interface E2E diagnostics
        # Screenshot, UI-Automation-Baum und Fehlerbeschreibung fehlgeschlagener FlaUI-Tests.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-diagnostics-os-staging
          path: e2e-diagnostics/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload OS-interface E2E crash dumps
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-dumps-os-staging
          path: e2e-dumps/
          if-no-files-found: ignore
          retention-days: 7

  version:
    name: version
    needs: [detect-backmerge, static-checks, build-and-test]
    if: needs.detect-backmerge.outputs.is_backmerge != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.semver.outputs.changed }}
      version: ${{ steps.semver.outputs.version }}
      rc_tag: ${{ steps.semver.outputs.rc_tag }}
      rc_version: ${{ steps.semver.outputs.rc_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Determine next version and RC number
        # scripts/determine-next-version.mjs ersetzt `semantic-release --dry-run` der Vorlage (erste Version
        # 0.1.0, nie automatisch auf 1.0). rc_version (mit Suffix, ohne v) - nicht `version` - muss in die
        # Build-Jobs fließen, sonst melden update.json und das Paket die stabile statt der RC-Version
        # (Vorlage, Abschnitt 11.2).
        id: semver
        run: node scripts/determine-next-version.mjs --rc

  prerelease:
    name: prerelease
    needs: [detect-backmerge, version]
    if: needs.detect-backmerge.outputs.is_backmerge != 'true' && needs.version.outputs.changed == 'true'
    runs-on: windows-latest
    # Apple-Zielframeworks ausblenden: nur der macOS-Job installiert die iOS-Workload (siehe Tankradar.MAUI.csproj).
    env:
      IncludeAndroidTarget: 'false'
      IncludeIosTarget: 'false'
      IncludeMacCatalystTarget: 'false'
    timeout-minutes: 45
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build and package release candidate
        uses: ./.github/actions/build-and-package
        with:
          release-version: ${{ needs.version.outputs.rc_version }}
          release-tag: ${{ needs.version.outputs.rc_tag }}

      - name: Create GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          RC_TAG: ${{ needs.version.outputs.rc_tag }}
        run: |
          gh release create "$RC_TAG" artifacts/release-win-x64.zip artifacts/update.json \
            --target "$GITHUB_SHA" \
            --title "$RC_TAG" \
            --prerelease \
            --generate-notes

  # iOS-Pre-Release-Build: signiert (und optional nach TestFlight hochgeladen), wenn IOS_SIGNING_ENABLED='true'
  # und alle Secrets vorhanden sind, sonst unsigniert (Compile-Prüfung) - ohne Fehlschlag.
  ios-prerelease:
    name: ios prerelease
    needs: [detect-backmerge, version]
    if: needs.detect-backmerge.outputs.is_backmerge != 'true' && needs.version.outputs.changed == 'true'
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build, sign and upload iOS
        id: ios
        uses: ./.github/actions/package-ios
        with:
          release-version: ${{ needs.version.outputs.rc_version }}
          signing-enabled: ${{ vars.IOS_SIGNING_ENABLED }}
          bundle-id: ${{ vars.APP_BUNDLE_ID }}
          codesign-key: ${{ secrets.IOS_CODESIGN_KEY }}
          provisioning-profile: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          certificate-p12-base64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          certificate-p12-password: ${{ secrets.IOS_CERTIFICATE_P12_PASSWORD }}
          provisioning-profile-base64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          api-key-id: ${{ secrets.IOS_API_KEY_ID }}
          api-issuer-id: ${{ secrets.IOS_API_ISSUER_ID }}
          api-key-p8: ${{ secrets.IOS_API_KEY_P8 }}
          xcode-version: ${{ vars.IOS_XCODE_VERSION }}
          fuel-price-api-key: ${{ secrets.FUEL_PRICE_API_KEY }}

  back-merge-skip:
    needs: detect-backmerge
    if: needs.detect-backmerge.outputs.is_backmerge == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Back-merge detected
        run: echo "This push is a pure back-merge from main - all checks skipped."
