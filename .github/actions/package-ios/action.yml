name: Package iOS
description: >
  Baut die iOS-Variante (Mindestversion iOS 16) nach der bewährten Vorlage. Ist die Signierung aktiviert
  und sind alle Signierungsdaten vorhanden, entsteht eine signierte .ipa (release-ios.ipa), die optional
  per iTMSTransporter nach TestFlight hochgeladen wird. Andernfalls wird unsigniert gebaut (Simulator-Build
  als Compile-Prüfung) und der Schritt schlägt deswegen nicht fehl. Läuft ausschließlich auf macOS-Runnern
  und benötigt einen Checkout mit vollständiger Historie (fetch-depth 0) für die Buildnummer.

inputs:
  release-version:
    description: Version ohne führendes v (ggf. mit Pre-Release-Suffix), wird als -p:Version übergeben. Leer = Version aus der csproj.
    required: false
    default: ''
  signing-enabled:
    description: "'true' aktiviert den signierten Build (Repository-Variable IOS_SIGNING_ENABLED). Alles andere = unsigniert."
    required: false
    default: 'false'
  bundle-id:
    description: Bundle-ID (Repository-Variable APP_BUNDLE_ID), wird als -p:ApplicationId übergeben. Leer = Standardwert aus der csproj.
    required: false
    default: ''
  codesign-key:
    description: Signierungsidentität für -p:CodesignKey (z. B. Apple Distribution), aus GitHub Secrets.
    required: false
    default: ''
  provisioning-profile:
    description: Name des Provisioning-Profils für -p:CodesignProvision, aus GitHub Secrets.
    required: false
    default: ''
  certificate-p12-base64:
    description: Base64-kodierter .p12-Export des Distribution-Zertifikats inklusive privatem Schlüssel.
    required: false
    default: ''
  certificate-p12-password:
    description: Passwort des exportierten .p12.
    required: false
    default: ''
  provisioning-profile-base64:
    description: Base64-kodierte .mobileprovision-Datei.
    required: false
    default: ''
  api-key-id:
    description: App-Store-Connect-API-Key-ID. Zusammen mit api-key-p8 und api-issuer-id wird die signierte .ipa nach TestFlight hochgeladen.
    required: false
    default: ''
  api-issuer-id:
    description: App-Store-Connect-Issuer-ID.
    required: false
    default: ''
  api-key-p8:
    description: Inhalt des privaten App-Store-Connect-API-Schlüssels (.p8), aus GitHub Secrets.
    required: false
    default: ''
  ios-workload-version:
    description: Zu pinnende Microsoft.iOS.Sdk-Pack-/Manifest-Version. Muss zu einem Release-Xcode auf dem Runner passen - der App Store lehnt Builds aus Beta-Xcode ab.
    required: false
    default: '26.5.10318'
  xcode-version:
    description: "Optional: gewünschte Xcode-Version (z. B. 26.0). Leer = Standard des Runners."
    required: false
    default: ''
  fuel-price-api-key:
    description: API-Schlüssel des Kraftstoffpreis-Dienstes (aus GitHub Secrets); darf leer sein.
    required: false
    default: ''
  routing-api-key:
    description: API-Schlüssel des Routing-Dienstes (aus GitHub Secrets); darf leer sein.
    required: false
    default: ''

outputs:
  signed:
    description: "'true', wenn signiert gebaut wurde (release-ios.ipa liegt im Workspace), sonst 'false'."
    value: ${{ steps.mode.outputs.signed }}

runs:
  using: composite
  steps:
    - name: Select Xcode
      if: ${{ inputs.xcode-version != '' }}
      shell: bash
      env:
        XCODE_VERSION: ${{ inputs.xcode-version }}
      run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"

    # Signiert wird nur, wenn die Signierung aktiviert ist UND alle Signierungsdaten vorhanden sind.
    # Fehlt etwas, wird bewusst unsigniert gebaut statt zu scheitern (Projektvorgabe).
    - name: Determine signing mode
      id: mode
      shell: bash
      env:
        ENABLED: ${{ inputs.signing-enabled }}
        P12: ${{ inputs.certificate-p12-base64 }}
        P12_PASSWORD: ${{ inputs.certificate-p12-password }}
        PROFILE: ${{ inputs.provisioning-profile-base64 }}
        CODESIGN_KEY: ${{ inputs.codesign-key }}
        PROFILE_NAME: ${{ inputs.provisioning-profile }}
        API_KEY_ID: ${{ inputs.api-key-id }}
        API_ISSUER_ID: ${{ inputs.api-issuer-id }}
        API_KEY_P8: ${{ inputs.api-key-p8 }}
      run: |
        if [ "$ENABLED" != "true" ]; then
          echo "signed=false" >> "$GITHUB_OUTPUT"
          echo "::notice::iOS wird unsigniert gebaut (IOS_SIGNING_ENABLED ist nicht 'true')."
          exit 0
        fi
        missing=""
        [ -n "$P12" ] || missing="$missing IOS_CERTIFICATE_P12_BASE64"
        [ -n "$P12_PASSWORD" ] || missing="$missing IOS_CERTIFICATE_P12_PASSWORD"
        [ -n "$PROFILE" ] || missing="$missing IOS_PROVISIONING_PROFILE_BASE64"
        [ -n "$CODESIGN_KEY" ] || missing="$missing IOS_CODESIGN_KEY"
        [ -n "$PROFILE_NAME" ] || missing="$missing IOS_PROVISIONING_PROFILE"
        if [ -z "$missing" ]; then
          echo "signed=true" >> "$GITHUB_OUTPUT"
          if [ -z "$API_KEY_P8" ] || [ -z "$API_KEY_ID" ] || [ -z "$API_ISSUER_ID" ]; then
            echo "::notice::Signierter Build ohne TestFlight-Upload: IOS_API_KEY_ID, IOS_API_ISSUER_ID oder IOS_API_KEY_P8 fehlt."
          fi
        else
          echo "signed=false" >> "$GITHUB_OUTPUT"
          echo "::warning::IOS_SIGNING_ENABLED ist 'true', aber es fehlen Secrets:$missing - iOS wird unsigniert gebaut."
        fi

    # SDK-Band 10.0.1xx pinnen: die iOS-Workload-Manifeste werden pro SDK-Band publiziert; 26.x-Manifeste
    # (Release-Xcode-kompatibel) existieren nur im 10.0.100-Feed, der 10.0.400-Feed kennt nur 27.x-Workloads,
    # die Beta-Xcode verlangen (der Store lehnt Beta ab). Das gilt auch für den unsignierten Compile-Check,
    # damit er dieselbe Toolchain prüft wie der Release-Build.
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.1xx'

    # global.json nur im CI-Workspace: der Runner bringt zusätzlich ein neueres SDK (10.0.4xx) mit; ohne
    # global.json wählt der Host-Resolver immer das höchste SDK und das Workload-Band wäre wieder 10.0.400.
    # Die Datei wird absichtlich nicht committet - lokal darf jedes 10.0.x-SDK verwendet werden.
    - name: Pin SDK band for this job
      shell: bash
      run: |
        printf '{"sdk":{"version":"10.0.100","rollForward":"latestPatch","allowPrerelease":false}}\n' > global.json
        dotnet --version

    # Workload-Version pinnen: 'workload restore' aktualisiert die Manifeste immer auf 'latest' (aktuell 27.x
    # mit Beta-Xcode-Anforderung) und würde den Pin wieder deinstallieren. Deshalb erst per Rollback-File das
    # iOS-Manifest pinnen, dann mit --skip-manifest-update installieren, damit exakt die gepinnte Version
    # aufgelöst wird.
    - name: Install .NET MAUI workload
      shell: bash
      env:
        IOS_WORKLOAD_VERSION: ${{ inputs.ios-workload-version }}
        IncludeAndroidTarget: 'false'
        IncludeMacCatalystTarget: 'false'
      run: |
        set -euo pipefail
        printf '{"microsoft.net.sdk.ios": "%s"}\n' "$IOS_WORKLOAD_VERSION" > "$RUNNER_TEMP/workload-rollback.json"
        dotnet workload update --from-rollback-file "$RUNNER_TEMP/workload-rollback.json"
        dotnet workload install maui-ios ios --skip-manifest-update
        # Auf dem Runner vorinstallierte iOS-Packs anderer Version entfernen: die TPV-Resolution würde sonst
        # das neueste Pack wählen - unabhängig vom gepinnten Manifest.
        # Bewusste Abweichung von der Vorlage (dort: rm -rf "$(dirname "$d")", also das ganze Pack-Verzeichnis):
        # Hier wird nur das Versionsverzeichnis entfernt, damit ein Pack-Verzeichnis, das auch die gepinnte Version
        # enthält, nicht samt dieser Version gelöscht wird.
        for d in "$HOME"/.dotnet/packs/Microsoft.iOS.Sdk.net10.0_*/*/; do
          [ -d "$d" ] || continue
          [ "$(basename "$d")" = "$IOS_WORKLOAD_VERSION" ] || rm -rf "$d"
        done

    # Signatur-Material importieren: das Runner-Image hat weder Distribution-Zertifikat noch Provisioning-Profil.
    # Temporäre Keychain mit Zufallspasswort; set-key-partition-list verhindert den GUI-Passwort-Prompt beim
    # Signieren.
    - name: Install signing certificate and provisioning profile
      if: ${{ steps.mode.outputs.signed == 'true' }}
      shell: bash
      env:
        P12_BASE64: ${{ inputs.certificate-p12-base64 }}
        P12_PASSWORD: ${{ inputs.certificate-p12-password }}
        PROFILE_BASE64: ${{ inputs.provisioning-profile-base64 }}
      run: |
        set -euo pipefail
        KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
        KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
        echo "$KEYCHAIN_PATH" > "$RUNNER_TEMP/keychain-path.txt"
        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        echo "$P12_BASE64" | base64 -d > "$RUNNER_TEMP/dist.p12"
        security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild
        rm -f "$RUNNER_TEMP/dist.p12"
        EXISTING=$(security list-keychains -d user | tr -d '"')
        security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING
        security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
        mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
        echo "$PROFILE_BASE64" | base64 -d > "$RUNNER_TEMP/profile.mobileprovision"
        cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/ci-$GITHUB_RUN_ID.mobileprovision"
        rm -f "$RUNNER_TEMP/profile.mobileprovision"
        unset KEYCHAIN_PASSWORD

    # ApplicationDisplayVersion/ApplicationVersion explizit setzen: die csproj pinnt beide für lokale Builds.
    # Die Buildnummer ist die Commit-Anzahl - repo-weit monoton, anders als github.run_number, das pro Workflow
    # zählt (staging-ci und release würden sonst kollidierende CFBundleVersion-Werte erzeugen). run_attempt
    # erhöht sich bei Wiederholungsläufen desselben Commits.
    # ApplicationDisplayVersion akzeptiert nur numerische Versionen - bei Pre-Releases (0.4.0-rc.1) wird der
    # Suffix abgeschnitten (CFBundleShortVersionString muss numerisch sein).
    # MauiXamlInflator=XamlC: die Vorlage umgeht damit invaliden SourceGen-Code (CS0266/CS8422) der Runner-
    # MAUI-Version in der iOS-Kompilierung; übernommen, bis auf macOS das Gegenteil belegt ist.
    # Abweichung zur Vorlage: kein separates 'restore -r ios-arm64' mit --no-restore, der implizite Restore
    # von build/publish reicht. Wichtig: Der Restore wertet ALLE Zielframeworks der csproj aus und bricht bei
    # einer fehlenden Workload mit NETSDK1147 ab - '-f net10.0-ios' schränkt das nicht ein. Wie in der Vorlage
    # werden deshalb die übrigen Zielframeworks per Eigenschaft ausgeblendet (IncludeAndroidTarget=false,
    # IncludeMacCatalystTarget=false, siehe Tankradar.MAUI.csproj); installiert ist nur die iOS-Workload.
    - name: Build iOS
      shell: bash
      env:
        SIGNED: ${{ steps.mode.outputs.signed }}
        RELEASE_VERSION: ${{ inputs.release-version }}
        BUNDLE_ID: ${{ inputs.bundle-id }}
        CODESIGN_KEY: ${{ inputs.codesign-key }}
        PROFILE_NAME: ${{ inputs.provisioning-profile }}
        TANKRADAR_FUEL_PRICE_API_KEY: ${{ inputs.fuel-price-api-key }}
        TANKRADAR_ROUTING_API_KEY: ${{ inputs.routing-api-key }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
        IncludeAndroidTarget: 'false'
        IncludeMacCatalystTarget: 'false'
      run: |
        set -euo pipefail
        BUILD_NUMBER=$(( $(git rev-list --count HEAD) + RUN_ATTEMPT - 1 ))
        args=(src/Tankradar.MAUI/Tankradar.MAUI.csproj
          --configuration Release --framework net10.0-ios
          "-p:ApplicationVersion=$BUILD_NUMBER"
          -p:MauiXamlInflator=XamlC)
        if [ -n "$RELEASE_VERSION" ]; then
          args+=("-p:Version=$RELEASE_VERSION" "-p:InformationalVersion=$RELEASE_VERSION"
            "-p:ApplicationDisplayVersion=${RELEASE_VERSION%%-*}")
        fi
        [ -z "$BUNDLE_ID" ] || args+=("-p:ApplicationId=$BUNDLE_ID")
        if [ "$SIGNED" = "true" ]; then
          dotnet publish "${args[@]}" -p:RuntimeIdentifier=ios-arm64 -p:ArchiveOnBuild=true \
            "-p:CodesignKey=$CODESIGN_KEY" "-p:CodesignProvision=$PROFILE_NAME"
        else
          # Simulator-RID: übersetzt und linkt die komplette iOS-Variante (iOS 16), benötigt aber weder
          # Zertifikat noch Provisioning-Profil und kann daher ohne Signierungsdaten nicht daran scheitern.
          dotnet build "${args[@]}" -p:RuntimeIdentifier=iossimulator-arm64
        fi

    - name: Collect iOS package
      if: ${{ steps.mode.outputs.signed == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        ipas=()
        while IFS= read -r -d '' file; do
          ipas+=("$file")
        done < <(find src/Tankradar.MAUI/bin/Release -name '*.ipa' -print0 | sort -z)
        if [ "${#ipas[@]}" -eq 0 ]; then
          echo "::error::No .ipa artifact found under src/Tankradar.MAUI/bin/Release after publish."
          exit 1
        fi
        # dotnet publish may write the same artifact to both the RID directory and publish/ - deduplicate by basename.
        distinct=$(printf '%s\n' "${ipas[@]##*/}" | sort -u | wc -l)
        if [ "$distinct" -gt 1 ]; then
          echo "::error::Multiple distinct .ipa artifacts found under src/Tankradar.MAUI/bin/Release; expected exactly one:"
          printf '%s\n' "${ipas[@]##*/}" | sort -u
          exit 1
        fi
        ipa=""
        for f in "${ipas[@]}"; do
          case "$f" in */publish/*) ipa="$f"; break;; esac
        done
        if [ -z "$ipa" ]; then ipa="${ipas[0]}"; fi
        cp "$ipa" release-ios.ipa

    # TestFlight-Upload: läuft nur bei signiertem Build und gesetzten API-Key-Secrets.
    # iTMSTransporter liegt auf den Runnern nicht in Transporter.app - gesucht wird in den Apple-Standardorten
    # (gleiche Liste wie Get-TransporterFindScript in scripts/iOS-Deployment.ps1).
    - name: Upload to TestFlight
      if: ${{ steps.mode.outputs.signed == 'true' && inputs.api-key-p8 != '' && inputs.api-key-id != '' && inputs.api-issuer-id != '' }}
      shell: bash
      env:
        ASC_KEY_ID: ${{ inputs.api-key-id }}
        ASC_ISSUER_ID: ${{ inputs.api-issuer-id }}
        ASC_KEY_P8: ${{ inputs.api-key-p8 }}
      run: |
        set -euo pipefail
        mkdir -p "$HOME/.appstoreconnect/private_keys"
        chmod 700 "$HOME/.appstoreconnect/private_keys"
        printf '%s' "$ASC_KEY_P8" > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
        # iTMSTransporter finden: Developer/usr/bin (und xcrun) liefern auf aktuellem Xcode nur einen Stub, der
        # 'iTMSTransporter is now part of Transporter' meldet - die echten Orte sind die Transporter.app-
        # Installation und das Standalone-Paket unter /usr/local/itms bzw. das ContentDeliveryServices.framework.
        DEVDIR="$(xcode-select -p 2>/dev/null || true)"
        CANDIDATES=(
          "/Applications/Transporter.app/Contents/itms/bin/iTMSTransporter"
          "$HOME/Applications/Transporter.app/Contents/itms/bin/iTMSTransporter"
          "/usr/local/itms/bin/iTMSTransporter"
        )
        if [ -n "$DEVDIR" ]; then
          CANDIDATES+=(
            "$DEVDIR/../SharedFrameworks/ContentDeliveryServices.framework/Versions/A/itms/bin/iTMSTransporter"
          )
        fi
        ITMS=""
        for c in "${CANDIDATES[@]}"; do
          if [ -x "$c" ]; then ITMS="$c"; break; fi
        done
        # Fallback: offizielles Standalone-Paket von Apples CDN installieren (Transporter.app ist auf den
        # Runnern nicht vorinstalliert, Xcode liefert nur den Stub).
        if [ -z "$ITMS" ]; then
          echo "Kein funktionierender iTMSTransporter gefunden - installiere Standalone-Paket ..."
          curl -fsSL "https://itunesconnect.apple.com/WebObjects/iTunesConnect.woa/ra/resources/download/public/Transporter__OSX/bin/" \
            -o "$RUNNER_TEMP/itmstransporter.pkg"
          # Nur ein von Apple signiertes Paket installieren (der Fallback ist auf einem Runner ungetestet).
          pkgutil --check-signature "$RUNNER_TEMP/itmstransporter.pkg" | grep -q "Apple"             || { echo "::error::Das heruntergeladene Transporter-Paket ist nicht von Apple signiert."; exit 1; }
          sudo installer -pkg "$RUNNER_TEMP/itmstransporter.pkg" -target /
          rm -f "$RUNNER_TEMP/itmstransporter.pkg"
          if [ -x /usr/local/itms/bin/iTMSTransporter ]; then
            ITMS=/usr/local/itms/bin/iTMSTransporter
          fi
        fi
        if [ -z "$ITMS" ]; then
          echo "::error::iTMSTransporter not found on runner (or only the deprecated stub)."
          exit 1
        fi
        echo "Using iTMSTransporter: $ITMS"
        "$ITMS" -m upload -assetFile release-ios.ipa -apiKey "$ASC_KEY_ID" -apiIssuer "$ASC_ISSUER_ID"

    # Aufräumen, auch bei Fehlschlag: Keychain und API-Key entfernen.
    - name: Remove signing material
      if: ${{ always() }}
      shell: bash
      run: |
        KEYCHAIN_PATH="$(cat "$RUNNER_TEMP/keychain-path.txt" 2>/dev/null || true)"
        rm -f "$RUNNER_TEMP/keychain-path.txt" "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP/profile.mobileprovision"
        rm -f "$HOME"/.appstoreconnect/private_keys/AuthKey_*.p8 || true
        rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/ci-$GITHUB_RUN_ID.mobileprovision" || true
        if [ -n "$KEYCHAIN_PATH" ]; then
          security list-keychains -d user -s login.keychain-db || true
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
        fi
